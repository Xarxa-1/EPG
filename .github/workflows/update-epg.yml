name: Actualitza EPG

on:
  schedule:
    # S'executa cada 6 hores automàticament
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permet l'execució manual des de GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permís necessari per poder fer el git push

    steps:
    - name: Baixar el repositori
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instal·lar dependències
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generar EPG
      run: python scripts/generate_epg.py

    - name: Desar canvis a GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Auto-update EPG data" || exit 0
        git push
