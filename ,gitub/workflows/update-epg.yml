name: Actualitza EPG

on:
  schedule:
    # S'executa cada 6 hores (minut 0 dels hores 0, 6, 12, 18)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permet executar-ho manualment des de GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar el repositori
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Instal·lar dependències
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generar EPG
      run: python scripts/generate_epg.py

    - name: Desar canvis a GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add epg.xml
        git commit -m "Auto-update EPG data" || exit 0
        git push
